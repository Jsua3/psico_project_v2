# Actualizaciones semanales de dependencias: así el stack no vuelve a quedar
# obsoleto sin que nadie lo note. Cada PR pasa por el mismo CI que el resto del
# código (pytest, jest/vitest, build, e2e); las menores y de parche se agrupan
# para no inundar de PRs, y las versiones mayores llegan en PR propio.
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend_django
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @angular/build 22 exige typescript >=6.0 <6.1: subir a 7.x rompe `npm ci` (ERESOLVE) y el CI.
      # Se reabre cuando Angular admita la versión nueva.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # El volumen de desarrollo es PostgreSQL 16: una imagen de otra versión mayor no arranca sobre
      # sus datos. Un salto de mayor es una migración deliberada (dump/restore), no una actualización.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
