# Recorridos completos del caso (@full-case, 4 viewports) y pruebas de
# orientación (@orientation: primer minuto, etapa 1 guiada y salida segura en
# cada estado, en escritorio 1366 y móvil horizontal 844x390). Fuera del CI de
# los PR: en el runner sin GPU cada recorrido tarda ~3-4x más que en local. Los
# dos grupos corren en jobs paralelos (cada uno en su runner, con su propia BD)
# cada noche sobre master y a mano (Actions → "E2E recorridos completos" → Run
# workflow, eligiendo la rama). Propuesta pendiente de decisión (pregunta 10 del
# backlog): correr también el recorrido de escritorio-1366 en los PR que tocan el
# simulador; hay un borrador inactivo en docs/pendientes/deudas/e2e-full-case-pr.yml.draft.
name: E2E recorridos completos

on:
  schedule:
    - cron: '0 7 * * *' # 02:00 en Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-case-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.14'

jobs:
  full-case:
    name: E2E full-case (4 viewports)
    runs-on: ubuntu-latest
    # 4 recorridos x 20 min de límite (300 s x E2E_TIME_SCALE) + preparación:
    # aun si todos agotan su tiempo, quedan minutos para subir los artefactos.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_django/requirements.txt
      - name: Crear venv del backend
        run: |
          python -m venv backend_django/.venv
          backend_django/.venv/bin/pip install -r backend_django/requirements.txt
      - run: npm ci --prefix frontend
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # list: duración de cada recorrido en el log, para recalibrar el factor.
      - run: npm run test:e2e -- --grep @full-case --reporter=list
        env:
          # Plazos del harness x4 (frontend/e2e/support/time-scale.ts): aquí
          # el WebGL va por software y el recorrido tarda ~3-4x más que en local.
          E2E_TIME_SCALE: '4'
      - name: Subir artefactos de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-case-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  orientation:
    name: E2E orientación (escritorio y móvil horizontal)
    runs-on: ubuntu-latest
    # 8 pruebas (4 escritorio, 4 móvil) de 4-6 min en local; con E2E_TIME_SCALE=4
    # el límite de cada una es de 16-24 min y el job entero no pasa de 90 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_django/requirements.txt
      - name: Crear venv del backend
        run: |
          python -m venv backend_django/.venv
          backend_django/.venv/bin/pip install -r backend_django/requirements.txt
      - run: npm ci --prefix frontend
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep @orientation --reporter=list
        env:
          E2E_TIME_SCALE: '4'
      - name: Subir artefactos de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-orientation-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
