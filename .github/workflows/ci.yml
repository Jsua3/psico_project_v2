# CI de SIEP: ejecuta los MISMOS runners que en local (npm run test:*), así
# CI y desarrollo no divergen. Las BD de prueba son desechables (Compose +
# tmpfs) y las levantan los propios scripts; aquí solo se prepara el entorno.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24 LTS hasta el 2026-10-28: ese día se sube a '26' junto con `.nvmrc` (TOO-8). `engines` ya admite las dos.
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.14'

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: un secreto borrado en un commit posterior sigue publicado.
          fetch-depth: 0
      # Binario fijado y verificado por suma de comprobación (sin la acción oficial,
      # que pide licencia en repositorios de organización). Falla solo si hay hallazgos
      # que no estén en .github/gitleaks.toml (falsos positivos ya revisados).
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks
      - name: Buscar secretos en el historial
        run: ./gitleaks detect --source . --config .github/gitleaks.toml --redact --no-banner --verbose

  scripts:
    name: Scripts de entorno (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run test:scripts

  audit:
    name: Vulnerabilidades (pip-audit + npm audit)
    # Falla si alguna dependencia (directa o transitiva) del backend o del frontend
    # tiene un aviso conocido de severidad alta o crítica. Corre en cada PR y push a
    # master; Dependabot (ver dependabot.yml) propone cada semana las
    # actualizaciones que lo mantienen en verde.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r backend_django/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --prefix frontend --audit-level=high

  backend:
    name: Backend (check + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_django/requirements*.txt
      - name: Crear venv del backend
        run: |
          python -m venv backend_django/.venv
          backend_django/.venv/bin/pip install -r backend_django/requirements-dev.txt
      - run: npm run check:backend
      - run: npm run test:backend

  frontend:
    name: Frontend (vitest + assets + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run test:frontend
      - run: npm run test:visual-assets --prefix frontend
      - run: npm run test:kit --prefix frontend
      - run: npm run kit:check --prefix frontend
      - run: npm run test:world-art --prefix frontend
      - run: npm run test:ui --prefix frontend
      - run: npm run ui:lint
      - run: npm run e2e:types
      - run: npm run build:frontend

  e2e:
    name: E2E (matriz API + Playwright)
    # Solo si lo barato pasó. Sin los recorridos completos (@full-case) ni los
    # de orientación (@orientation: recorren la etapa 1 y la salida segura en
    # cada estado): en el runner sin GPU van ~3-4x más lentos que en local, así
    # que corren aparte en e2e-full-case.yml (nocturno + manual) y no bloquean el PR.
    needs: [scripts, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_django/requirements*.txt
      - name: Crear venv del backend
        run: |
          python -m venv backend_django/.venv
          backend_django/.venv/bin/pip install -r backend_django/requirements-dev.txt
      - run: npm ci --prefix frontend
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert "@full-case|@orientation"
      - name: Subir artefactos de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
