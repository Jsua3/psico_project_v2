# CI de SIEP: ejecuta los MISMOS runners que en local (npm run test:*), así
# CI y desarrollo no divergen. Las BD de prueba son desechables (Compose +
# tmpfs) y las levantan los propios scripts; aquí solo se prepara el entorno.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'

jobs:
  scripts:
    name: Scripts de entorno (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run test:scripts

  backend:
    name: Backend (check + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_django/requirements.txt
      - name: Crear venv del backend
        run: |
          python -m venv backend_django/.venv
          backend_django/.venv/bin/pip install -r backend_django/requirements.txt
      - run: npm run check:backend
      - run: npm run test:backend

  frontend:
    name: Frontend (jest + assets + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run test:frontend
      - run: npm run test:visual-assets --prefix frontend
      - run: npm run test:kit --prefix frontend
      - run: npm run kit:check --prefix frontend
      - run: npm run test:world-art --prefix frontend
      - run: npm run build:frontend

  e2e:
    name: E2E (matriz API + Playwright)
    # Solo si lo barato pasó. Sin los recorridos completos (@full-case): en el
    # runner sin GPU van ~3-4x más lentos que en local, así que corren aparte
    # en e2e-full-case.yml (nocturno + manual) y no bloquean el PR.
    needs: [scripts, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_django/requirements.txt
      - name: Crear venv del backend
        run: |
          python -m venv backend_django/.venv
          backend_django/.venv/bin/pip install -r backend_django/requirements.txt
      - run: npm ci --prefix frontend
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert @full-case
      - name: Subir artefactos de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
