# Stack de DESARROLLO de SIEP v3.
#
# name: fija el proyecto Compose para que los recursos (contenedor y volumen)
# queden etiquetados como de ESTE checkout. No usamos container_name global:
# un nombre fijo colisiona con otros checkouts y permite reutilizar por error
# una base ajena (los scripts verifican labels antes de tocar nada).
name: psico-project-v3

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: psychosim
      POSTGRES_USER: psychosim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psychosim_secret}
    ports:
      - "${SIEP_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 guarda los datos bajo /var/lib/postgresql/18/docker: se monta el directorio
      # padre. Un volumen creado con la 16 NO sirve: npm run up lo detecta y explica la migración.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psychosim"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
