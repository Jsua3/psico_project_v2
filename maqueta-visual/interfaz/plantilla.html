<title>Pantalla del juego unificada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Poppins:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<style>
/* Una sola mirada oscura (el juego es de noche): la página es la mesa de trabajo y la pantalla del juego es la pieza. */
:root {
  color-scheme: dark;
  --mesa: #100f17;          /* fondo de la página */
  --mesa-2: #18161f;        /* superficies de la página */
  --linea: #2c2838;         /* bordes de la página */
  --texto: #ece6d8;         /* texto de la página */
  --texto-2: #b3abc2;       /* texto secundario de la página */
  --acento: #ffcd82;        /* la luz de lámpara de la sala, la misma del cuadro de diálogo */
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --f-texto: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
body { background: var(--mesa); color: var(--texto); font-family: var(--f-texto); }
.pagina { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; max-width: 1760px; margin: 0 auto; display: grid; gap: 18px; }
.cab { display: grid; gap: 6px; }
.cab h1 { margin: 0; font-family: var(--f-mono); font-size: 1.35rem; letter-spacing: .01em; color: var(--acento); text-wrap: balance; }
.cab p { margin: 0; color: var(--texto-2); max-width: 70ch; line-height: 1.5; }
.mandos { display: grid; gap: 10px; }
.grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.grupo__nombre { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-2); min-width: 8.5em; }
.grupo button { font: 600 .82rem/1.2 var(--f-texto); color: var(--texto); background: var(--mesa-2); border: 1px solid var(--linea); padding: 8px 12px; min-height: 36px; cursor: pointer; border-radius: 2px; }
.grupo button[aria-pressed="true"] { background: var(--acento); color: #1b1530; border-color: var(--acento); }
.grupo button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.grupo button .reco { font-family: var(--f-mono); font-size: .7rem; margin-left: 6px; opacity: .8; }
.escena { display: grid; gap: 14px; }
.escena--lado { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 760px) { .escena--lado { grid-template-columns: minmax(0, 1fr); } }
.lamina { display: grid; gap: 6px; min-width: 0; }
.lamina__pie { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--texto-2); line-height: 1.4; }
.lamina__pie strong { font-family: var(--f-mono); color: var(--acento); font-weight: 700; }
.lamina__caja { position: relative; overflow: hidden; background: #000; }
.lamina__caja > .pantalla, .lamina__caja > .hoy { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.hoy { display: block; background: #0b0a12; }
.hoy img { display: block; width: 100%; height: 100%; object-fit: contain; }
.hoy__falta { width: 100%; height: 100%; display: grid; place-items: center; color: var(--texto-2); font-family: var(--f-mono); font-size: 18px; text-align: center; padding: 24px; box-sizing: border-box; }
.notas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.nota { background: var(--mesa-2); border: 1px solid var(--linea); padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.nota h2 { margin: 0; font-family: var(--f-mono); font-size: .9rem; color: var(--acento); letter-spacing: .02em; }
.nota p, .nota li { margin: 0; color: var(--texto); line-height: 1.55; font-size: .88rem; }
.nota ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.nota .suave { color: var(--texto-2); }
.tabla { overflow-x: auto; }
.tabla table { border-collapse: collapse; width: 100%; font-size: .8rem; }
.tabla th, .tabla td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linea); vertical-align: top; }
.tabla th { font-family: var(--f-mono); font-weight: 700; color: var(--texto-2); font-size: .72rem; letter-spacing: .04em; }
.tabla code { font-family: var(--f-mono); font-size: .76rem; color: var(--acento); }

/* ── La pantalla del juego ─────────────────────────────────────────────────────────────────────────────────────── */
/* Una pieza de pixel art: marco por border-image (4 px de mundo por lado) y trama; nada redondeado ni difuminado.   */
.pantalla {
  --px: 2px; --tam: 14px; --tam-d: 17px; --retrato: 192px; --rp: 2;
  --borde: calc(6 * var(--px));
  --tinta: #f2ecdf; --tinta-suave: #c3bccf; --tinta-oscura: #1b1530; --penumbra: #1b1826; --luz: #ffcd82;
  --contorno: #15131d; --tecla-fondo: #3a3454; --ambar: #f5d49b; --ambar-fondo: #3b2a12; --brasa-tinta: #ffd6c4; --cine: #0b0a12;
  --f-nombre: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --f-texto: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  position: relative; overflow: hidden; background: var(--cine); color: var(--tinta);
  font-family: var(--f-texto); font-size: var(--tam); line-height: 1.4;
}
.pantalla[data-tam="1920"] { --px: 3px; --tam: 17px; --tam-d: 20px; --retrato: 288px; --rp: 3; }
.pantalla[data-tam="390"] { --tam: 13px; --tam-d: 16px; --retrato: 64px; }
/* A 1920 el HUD va al punto del mundo (2 px: la cámara descansa en ×2), no al de 3 px del cuadro de diálogo: así tapa menos
   sala que hoy. El cuadro de I1 conserva sus 3 px desde 1800 de ancho. */
.pantalla[data-tam="1920"] .hud, .pantalla[data-tam="1920"] .cine-arriba, .pantalla[data-tam="1920"] .avisos-mundo, .pantalla[data-tam="1920"] .mundo { --px: 2px; --rp: 2; --tam: 16px; --borde: 12px; }
.pantalla *, .pantalla *::before, .pantalla *::after { box-sizing: border-box; }
:where(.pantalla) button { font: inherit; color: inherit; cursor: pointer; }

.u-placa, .u-rotulo, .u-boton, .u-salida, .u-ficha, .u-tecla, .u-ranura {
  border-style: solid; border-width: calc(4 * var(--px)); border-image: var(--m) 4 / calc(4 * var(--px)) stretch; border-radius: 0;
  background-color: var(--penumbra); background-image: var(--t); background-size: calc(8 * var(--px));
  background-clip: padding-box; background-origin: padding-box; image-rendering: pixelated;
}
.u-placa { --m: var(--marco-placa); --t: var(--trama-placa); }
.u-rotulo { --m: var(--marco-rotulo); --t: var(--trama-placa); border-bottom-width: 0; }
.u-ficha { --m: var(--marco-ficha); --t: var(--trama-ficha); }

/* Placa-botón (hermana de «Volver al mapa»): sobre y foco encienden el canto, pulsada se hunde un punto, apagada pierde la luz. */
.u-boton { --m: var(--marco-placa); --t: var(--trama-placa); display: inline-flex; align-items: center; gap: calc(4 * var(--px)); min-height: 44px; padding: 0 calc(6 * var(--px)) 1px calc(4 * var(--px)); font-weight: 600; color: var(--tinta); white-space: nowrap; }
.u-boton:focus-visible { --m: var(--marco-placa-foco); --t: var(--trama-placa-sobre); background-color: #24203a; outline: none; }
.u-boton:active { --m: var(--marco-placa-pulsada); --t: var(--trama-placa-pulsada); background-color: #16141f; transform: translateY(var(--px)); }
.u-boton[aria-disabled="true"] { --m: var(--marco-placa-apagada); --t: var(--trama-placa); color: #a9a2b8; cursor: default; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .u-boton:hover:not([aria-disabled="true"], :active) { --m: var(--marco-placa-sobre); --t: var(--trama-placa-sobre); background-color: #24203a; color: var(--luz); }
}
/* «Salida segura»: la misma placa con brasa en el canto (I1), lo primero que se encuentra en cualquier estado. */
.u-salida { --m: var(--marco-salida); --t: var(--trama-salida); display: inline-flex; align-items: center; gap: calc(4 * var(--px)); min-height: 44px; padding: 0 calc(6 * var(--px)) 1px calc(4 * var(--px)); background-color: #2e161c; color: var(--brasa-tinta); font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.u-salida::before { content: ''; flex: none; width: calc(11 * var(--px)); height: calc(9 * var(--px)); background: var(--icono-salida) 0 0 / 100% 100% no-repeat; image-rendering: pixelated; }
.u-salida:focus-visible { --m: var(--marco-salida-foco); --t: var(--trama-salida-sobre); background-color: #3e1c22; outline: none; }
.u-salida:active { --m: var(--marco-salida-pulsada); --t: var(--trama-salida-pulsada); background-color: #22100f; transform: translateY(var(--px)); }
@media (hover: hover) and (pointer: fine) {
  .u-salida:hover:not(:active) { --m: var(--marco-salida-sobre); --t: var(--trama-salida-sobre); background-color: #3e1c22; color: #fff1ea; }
}
/* La tecla: la misma de la letra A a D y de «Esc». Como botón de icono se enciende con la luz de la sala. */
.u-tecla { --m: var(--marco-tecla); --t: none; background-color: var(--tecla-fondo); display: inline-grid; place-items: center; font-family: var(--f-nombre); font-weight: 700; line-height: 1; color: var(--tinta); }
.u-tecla--letra { min-width: calc(15 * var(--px)); min-height: calc(15 * var(--px)); padding: 0 calc(2 * var(--px)) var(--px); font-size: .82em; }
.u-tecla--icono { width: 44px; height: 44px; }

.u-tecla--icono:focus-visible, .u-tecla--icono[aria-pressed="true"] { --m: var(--marco-tecla-encendida); background-color: var(--luz); color: var(--tinta-oscura); outline: none; }
.u-tecla--icono:active { --m: var(--marco-tecla-hundida); background-color: #221e33; transform: translateY(var(--px)); }
@media (hover: hover) and (pointer: fine) {
  .u-tecla--icono:hover:not(:active) { --m: var(--marco-tecla-encendida); background-color: var(--luz); color: var(--tinta-oscura); }
}
.ico { width: calc(var(--iw) * var(--px)); height: calc(var(--ih) * var(--px)); flex: none; display: block; }
.seguir { display: block; flex: none; width: calc(7 * var(--px)); height: calc(5 * var(--px)); background: var(--seguir) 0 0 / 100% 100% no-repeat; image-rendering: pixelated; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* El mundo: la sala por piezas a factor entero (la cámara de M1 descansa en ×2), con quien juega y los rótulos anclados. */
.mundo { position: absolute; inset: 0; overflow: hidden; }
.mundo img { position: absolute; image-rendering: pixelated; max-width: none; }
.etiqueta { position: absolute; transform: translate(-50%, 0); padding: 0 calc(3 * var(--px)) var(--px); background: var(--penumbra); box-shadow: 0 0 0 var(--px) var(--contorno), inset 0 var(--px) 0 #3a3452; font-family: var(--f-nombre); font-size: calc(var(--tam) * .8); font-weight: 700; color: var(--tinta); white-space: nowrap; line-height: 1.5; }
.aviso-puerta { position: absolute; --m: var(--marco-placa); --t: var(--trama-placa); display: inline-flex; align-items: center; gap: calc(3 * var(--px)); min-height: 44px; padding: 0 calc(5 * var(--px)) 1px calc(3 * var(--px)); white-space: nowrap; font-weight: 600; }
.aviso-puerta__detalle { font-weight: 400; color: var(--tinta-suave); }
.cola { position: absolute; width: calc(7 * var(--px)); height: calc(4 * var(--px)); }
.cola--lado { width: calc(4 * var(--px)); height: calc(7 * var(--px)); }

/* Los grupos del HUD: piezas sueltas sobre el mundo (B) o franja continua arriba (A). */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.esq-izq { position: absolute; left: var(--borde); top: var(--borde); width: min(440px, 33%); display: flex; flex-direction: column; align-items: flex-start; }
.pantalla[data-tam="1920"] .esq-izq { width: min(520px, 30%); }
.pestana { position: relative; z-index: 1; margin: 0 0 calc(-1 * var(--px)) calc(6 * var(--px)); padding: 1px calc(4 * var(--px)) calc(2 * var(--px)); display: flex; align-items: center; gap: calc(3 * var(--px)); max-width: calc(100% - 12 * var(--px)); font-family: var(--f-nombre); font-weight: 700; font-size: calc(var(--tam) * .86); line-height: 1.3; color: var(--luz); }
.pestana__txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pestana--suave { color: var(--tinta-suave); }
.objetivo { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1px calc(5 * var(--px)); min-height: 44px; padding: calc(2 * var(--px)) calc(5 * var(--px)) calc(3 * var(--px)) calc(5 * var(--px)); text-align: left; white-space: normal; }
.objetivo__kicker { grid-column: 1; font-family: var(--f-nombre); font-size: .8em; font-weight: 700; letter-spacing: .02em; color: var(--tinta-suave); }
.objetivo__texto { grid-column: 1; font-weight: 600; color: var(--tinta); line-height: 1.35; }
.objetivo .seguir { grid-column: 2; grid-row: 1 / span 2; }
.objetivo[aria-expanded="true"] .seguir { transform: scaleY(-1); }
.objetivo__cuerpo { width: 100%; margin-top: calc(-1 * var(--px)); padding: calc(3 * var(--px)) calc(5 * var(--px)) calc(4 * var(--px)); display: grid; gap: calc(3 * var(--px)); }
.objetivo__cuerpo h3 { margin: 0; font-family: var(--f-nombre); font-size: .8em; color: var(--luz); letter-spacing: .02em; }
.objetivo__cuerpo ul { margin: 0; padding: 0; list-style: none; display: grid; gap: calc(1 * var(--px)); }
.objetivo__cuerpo li { display: flex; align-items: center; gap: calc(3 * var(--px)); }
.marca { font-family: var(--f-nombre); font-size: .82em; color: var(--tinta-suave); }
.marca--hecha { color: #9fd9a8; }
.pista { display: flex; flex-wrap: wrap; align-items: center; gap: calc(2 * var(--px)) calc(4 * var(--px)); }
.pista .u-boton::before { content: ''; flex: none; width: calc(9 * var(--px)); height: calc(11 * var(--px)); background: var(--icono-bombilla) 0 0 / 100% 100% no-repeat; image-rendering: pixelated; }
.pista .u-boton[aria-disabled="true"]::before { background-image: var(--icono-bombilla-apagada); }
.pista__nota { font-size: .84em; color: var(--tinta-suave); }

.esq-der { position: absolute; right: var(--borde); top: var(--borde); display: flex; flex-direction: column; align-items: flex-end; }
.esq-der .pestana { margin: 0 calc(6 * var(--px)) calc(-1 * var(--px)) 0; max-width: 100%; }
.barra-der { display: flex; align-items: center; gap: calc(4 * var(--px)); padding: calc(2 * var(--px)) calc(2 * var(--px)) calc(2 * var(--px)) calc(3 * var(--px)); }
.persona { display: flex; align-items: center; gap: calc(4 * var(--px)); min-width: 0; }
.ventanilla { position: relative; flex: none; width: calc(24 * var(--rp) * 1px); height: calc(21 * var(--rp) * 1px); overflow: hidden; background: #6c6589; box-shadow: 0 0 0 var(--px) var(--contorno); }
.ventanilla img { position: absolute; left: calc(-4 * var(--rp) * 1px); top: calc(-5 * var(--rp) * 1px); width: calc(32 * var(--rp) * 1px); height: calc(32 * var(--rp) * 1px); image-rendering: pixelated; }
.persona__txt { display: grid; gap: 1px; min-width: 0; }
.persona__estado { display: flex; align-items: center; gap: calc(3 * var(--px)); font-weight: 600; line-height: 1.25; }
.persona__quien { font-family: var(--f-nombre); font-size: .78em; color: var(--tinta-suave); }
.pulso { flex: none; width: calc(16 * var(--px)); height: calc(8 * var(--px)); background: var(--pulso-TENSE) 0 0 / calc(64 * var(--px)) calc(8 * var(--px)) no-repeat; image-rendering: pixelated; animation: pulso 1s steps(4) 180; }
@keyframes pulso { to { background-position: calc(-64 * var(--px)) 0; } }
.separador { flex: none; align-self: stretch; width: var(--px); background: #2a2638; margin: calc(2 * var(--px)) 0; }
.teclas { display: flex; gap: calc(2 * var(--px)); }

/* El carril de avisos: arriba al centro, entre los dos grupos. Nunca cae sobre la ficha del objetivo ni sobre el plano. */
.carril { position: absolute; top: var(--borde); left: 50%; transform: translateX(-50%); width: max-content; max-width: min(460px, 32%); display: flex; flex-direction: column; align-items: center; gap: calc(3 * var(--px)); }
.pantalla[data-tam="1920"] .carril { max-width: min(640px, 32%); }
.aviso { display: flex; align-items: center; gap: calc(4 * var(--px)); min-height: 44px; padding: calc(1 * var(--px)) calc(3 * var(--px)) calc(2 * var(--px)) calc(5 * var(--px)); font-weight: 600; line-height: 1.35; }
.aviso--accion { color: var(--ambar); }
.aviso--breve { color: var(--tinta); }
.aviso--sala { padding: calc(2 * var(--px)) calc(8 * var(--px)) calc(3 * var(--px)); font-family: var(--f-nombre); font-weight: 700; color: var(--luz); font-size: 1.05em; }
.aviso--sensible { flex-direction: column; align-items: stretch; gap: calc(2 * var(--px)); padding: calc(3 * var(--px)) calc(5 * var(--px)) calc(4 * var(--px)); max-width: 100%; }
.aviso--sensible p { margin: 0; font-weight: 400; color: var(--tinta); }
.sensible { color: var(--ambar); }
.u-tecla--cerrar { width: 44px; height: 44px; flex: none; }


/* El plano (M1): placa con el plano en pixel y su pestaña con el lugar. */
.plano { position: absolute; right: var(--borde); display: flex; flex-direction: column; align-items: flex-end; gap: calc(2 * var(--px)); }
.plano__caja { display: flex; flex-direction: column; align-items: stretch; }
.plano__caja .pestana { align-self: flex-end; margin: 0 calc(6 * var(--px)) calc(-1 * var(--px)) 0; max-width: none; }
.plano__abrir { display: grid; place-items: center; width: 100%; padding: calc(2 * var(--px)); line-height: 0; }
.plano__abrir svg { display: block; width: calc(96 * var(--px)); height: calc(44 * var(--px)); }
.plano__botones { display: flex; gap: calc(2 * var(--px)); }
.plano__botones .u-boton { font-size: .9em; }

/* Abajo: «Salida segura» y herramientas a la izquierda; la acción cercana a la derecha. */
.abajo-izq { position: absolute; left: var(--borde); bottom: var(--borde); display: flex; align-items: flex-end; gap: calc(4 * var(--px)); }
.abajo-izq > .u-salida { min-height: calc(28 * var(--px)); }
.herramientas { display: flex; flex-direction: column; align-items: flex-start; }
.herramientas .pestana { color: var(--tinta-suave); }
.herramientas .pestana b { color: var(--luz); font-weight: 700; }
.ranuras { display: flex; gap: calc(2 * var(--px)); }
.u-ranura { --m: var(--marco-ficha); --t: var(--trama-ficha); position: relative; width: calc(28 * var(--px)); height: calc(28 * var(--px)); padding: 0; display: grid; place-items: center; }
.u-ranura i { display: block; width: calc(20 * var(--px)); height: calc(20 * var(--px)); background-image: var(--h); background-size: calc(120 * var(--px)) calc(20 * var(--px)); background-repeat: no-repeat; image-rendering: pixelated; }
.u-ranura--bloqueada i { filter: grayscale(1) contrast(.75) brightness(1.05); opacity: .5; }
/* La sombra de tramado de la placa del cuadro (sombra.png), bajo cada pieza que flota sobre la sala. */
.objetivo, .barra-der, .plano__abrir, .accion, .abajo-izq > .u-salida, .tel-abajo .u-salida, .u-ranura, .aviso, .aviso-puerta, .franja { position: relative; }
.objetivo::after, .barra-der::after, .plano__abrir::after, .accion::after, .abajo-izq > .u-salida::after, .tel-abajo .u-salida::after, .u-ranura::before, .aviso::after, .aviso-puerta::after {
  content: ''; position: absolute; left: calc(-2 * var(--px)); right: calc(-2 * var(--px)); bottom: calc(-6 * var(--px)); height: calc(2 * var(--px));
  background-image: var(--sombra); background-size: calc(2 * var(--px)); image-rendering: pixelated; pointer-events: none;
}
.objetivo[aria-expanded="true"]::after { display: none; }
.u-ranura--bloqueada .candado { position: absolute; right: calc(-1 * var(--px)); bottom: calc(-1 * var(--px)); color: var(--tinta-suave); filter: drop-shadow(var(--px) 0 0 var(--contorno)) drop-shadow(0 var(--px) 0 var(--contorno)) drop-shadow(calc(-1 * var(--px)) 0 0 var(--contorno)) drop-shadow(0 calc(-1 * var(--px)) 0 var(--contorno)); }
.u-ranura--nueva { --m: var(--marco-ficha-foco); --t: var(--trama-ficha-sobre); }

function ico(nombre, extra = '') {

}

// ── El plano de SIM-VBG-002 (ilustrativo: la disposición real la da el layout del caso que lee M1). ────────────────────

const VISITADAS = new Set(['entrada', 'espera']);
function planoSvg() {

    const actual = s.k === 'espera', vista = VISITADAS.has(s.k);
    const relleno = actual ? 'var(--luz)' : vista ? '#3a3454' : 'none';
    const linea = actual ? '#15131d' : vista ? 'var(--tinta-suave)' : '#5c5672';
    r += `<rect x="${s.x}.5" y="${s.y}.5" width="${s.w - 1}" height="${s.h - 1}" fill="${relleno}" stroke="${linea}" stroke-width="1" ${!vista && !actual ? 'stroke-dasharray="2 1"' : ''}/>`;
  }
  r += '<rect x="44" y="30" width="2" height="2" fill="#15131d"/>'; // quien juega, en la sala actual
  return `<svg viewBox="0 0 96 44" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${r}</svg>`;
}

const PUERTA = { x: 720, arriba: 128, abajo: 236, izq: 690, der: 750, texto: 'Pasar a Pasillo', detalle: 'Todavía no se puede pasar.' };

const PERSONA = 'se muestra cautelosa y tensa';
const SENSIBLE = 'Este caso aborda violencia de género, tentativa de feminicidio y la muerte de una niña. Puedes usar la salida segura en cualquier momento.';
const HERRAMIENTAS = [

];
const TAM = { 1366: { w: 1366, h: 768, z: 2 }, 1920: { w: 1920, h: 1080, z: 2 }, 390: { w: 390, h: 844, z: 1 } };
const HOY_DE = {

};
const HOY_NOTA = {

  'decision-390': 'capturas-i1, teléfono', 'pista-1366': '«Ver pista» de hoy: capturas-demo/26', 'pista-1920': 'capturas-demo/26-3',

function escena(estado) {
  const e = { val: { x: 720, y: 268, cara: 'espalda' }, foco: { x: 720, y: 250 }, kit: true, herramientas: 0, nueva: false,
    accion: null, puerta: true, carril: [], objetivo: 'plegada', dialogo: null, capa: null, abajo: true, plano: true, cine: false };

  const hablar = { tecla: 'E', texto: 'Hablar con Abuela de la niña' };
  switch (estado) {
    case 'explorando': e.accion = bloqueada; break;
    case 'llegada': Object.assign(e, { val: { x: 720, y: 470, cara: 'frente' }, foco: { x: 720, y: 330 }, puerta: false,

function sensibleChip() {

function carril(e, variante) {

        <button type="button" class="u-salida">Salida segura</button></div>
      ${conNota ? '<p class="panel-head__note"><span class="panel-chip">Decisión</span><span>Tu elección queda registrada en tu seguimiento formativo.</span></p>' : ''}</header>`;
  if (tipo === 'conversacion') {
    return `<div class="dlg" data-tapa><div class="dialogue-strip" role="dialog" aria-modal="true" aria-label="Diálogo con Abuela de la niña">
      ${cabecera(false)}
      <div class="strip-main"><section class="placa"><p class="speaker-name">Abuela de la niña</p>
        <div class="placa-cuerpo">${retrato}<div class="placa-habla"><p class="dialogue-text">¡Por favor! Nadie nos dice nada</p>
          <div class="placa-pie">${tam !== '390' ? '<span class="u-tecla u-tecla--letra tecla-pie" aria-hidden="true">Enter</span>' : ''}<button type="button" class="close-btn">Siguiente <span aria-hidden="true">▶</span></button></div></div></div></section></div>
    </div></div>`;
  }
  const opciones = [
    ['A', 'Aplicar PAP a la familia en crisis', true], ['B', 'Notificar de inmediato la muerte de la niña a la familia', false],
    ['C', 'Aplicar PAP: contención emocional, acompañamiento en duelo y estabilización de la crisis', false],
    ['D', 'Interrogar a la víctima herida sobre el agresor antes de cirugía', false],
  ].map(([l, t, falta], i) => `<button type="button" class="choice-btn ${falta ? 'choice-btn--unavailable' : ''} ${i === 1 ? 'foco' : ''}" aria-label="${l}. ${t}${falta ? '. Aún no tienes esta herramienta. Recógela en la sala.' : ''}" ${falta ? 'aria-disabled="true"' : ''}>
      <span class="choice-num" aria-hidden="true" data-letra="${l}"></span><span class="choice-btn__body"><span>${t}</span>${falta ? '<span class="choice-btn__hint">Aún no tienes esta herramienta. Recógela en la sala.</span>' : ''}</span><i class="choice-btn__cursor" aria-hidden="true"></i></button>`).join('');
  return `<div class="dlg" data-tapa><div class="dialogue-strip strip--con-opciones" role="dialog" aria-modal="true" aria-label="Diálogo con Abuela de la niña">
    ${cabecera(true)}
    <div class="strip-main"><section class="placa"><p class="speaker-name">Abuela de la niña</p>
      <div class="placa-cuerpo">${retrato}<div class="placa-habla"><p class="dialogue-text"><span class="acot">(La familia está en crisis. Define el foco inmediato de tu intervención.)</span></p><div class="placa-pie"></div></div></div></section>
      <div class="strip-body"><p class="choices-notice" id="choices-notice" role="note">Puedes conocer más antes de responder.</p>
        <div class="pista"><button type="button" class="u-boton">Ver pista</button></div>
        <div class="choices" role="group" aria-label="Opciones de intervención" aria-describedby="choices-notice">${opciones}</div>
        <p class="keyboard-hint">Enter: continuar · A a D: elegir · Esc: volver al mapa</p></div></div>
  </div></div>`;
}

// ── Capas ────────────────────────────────────────────────────────────────────────────────────────────────────────────
function capa(tipo) {

    <p>Tu avance quedó guardado exactamente donde estabas. No hay penalización: puedes retomarlo cuando quieras.</p>
    <div class="modal__acciones"><button type="button" class="u-ficha u-ficha--primaria">Reanudar este intento</button><button type="button" class="u-boton">Volver al catálogo</button></div>
    <div class="hundido"><p class="kicker">Apoyo profesional</p><ul>
      <li>Puedes pausar el intento y retomarlo con acompañamiento docente.</li>

      <li>En riesgo inmediato, prioriza líneas locales de emergencia y rutas institucionales de protección.</li></ul></div>
    <button type="button" class="u-boton" aria-expanded="false" style="justify-content:space-between">Ver mi seguimiento <i class="seguir" aria-hidden="true"></i></button>
  </section>`;
  if (tipo === 'capitulo') return `<div class="velo velo--capitulo"></div><div class="capitulo" data-tapa>
    <p class="u-rotulo pestana">Capítulo 2</p><p class="u-placa" style="margin:0">La noticia. Hospital, madrugada.</p></div>`;
  if (tipo === 'ira') {
    const filas = [['Persona', 'Abuela de la niña', ''], ['Persona', 'Hermano mayor', ''], ['Puerta', 'Entrada de urgencias', ''],
      ['Puerta', 'Pasillo', `${ico('candado')}<span>Todavía no se puede pasar.</span>`]]
      .map(([k, n, a]) => `<button type="button" class="u-ficha"><small>${k.toUpperCase()}</small><span>${n}</span>${a ? `<span class="aviso-mini">${a}</span>` : ''}</button>`).join('');
    return `<div class="velo"></div><section class="u-placa modal" role="dialog" aria-modal="true" aria-labelledby="ira-t" data-tapa>
      <div><p class="kicker" id="ira-t">Ir a…</p><p style="color:var(--tinta-suave)">Elige a dónde quieres ir: caminarás hasta ahí y se te avisará al llegar.</p></div>
      <div class="lista-ir">${filas}</div>
      <div class="modal__acciones" style="justify-content:space-between"><button type="button" class="u-salida">Salida segura</button><button type="button" class="u-boton">Cerrar</button></div></section>`;
  }
  return '';
}

// ── Montaje de una pantalla ─────────────────────────────────────────────────────────────────────────────────────────
function pantalla(estado, tam, variante, opciones = {}) {
  const T = TAM[tam]; const e = escena(estado);
  // En el teléfono, al hablar la cámara se acerca a ×2 y deja a los dos en la franja libre sobre el cuadro (M1).
  const z = tam === '390' && e.dialogo ? 2 : T.z;
  if (tam === '390' && e.dialogo) e.foco = { x: e.foco.x, y: e.foco.y + (T.h / 2 - (e.dialogo === 'decision' ? 150 : 300)) / z };
  const raiz = document.createElement('div');
  raiz.className = 'pantalla'; raiz.dataset.tam = tam; raiz.dataset.var = variante; raiz.dataset.estado = estado;
  if (opciones.quieto) raiz.dataset.quieto = '';
  raiz.style.width = T.w + 'px'; raiz.style.height = T.h + 'px';
  for (const [k, v] of Object.entries(VARS)) raiz.style.setProperty(k, v);

  // Cámara: centra el foco y no muestra más allá de la sala (si la sala es más chica que la pantalla, la centra).
  let foco = { ...e.foco };
  if (opciones.defecto && estado === 'puerta') foco = { x: PUERTA.x + (T.w * 0.30) / z, y: PUERTA.arriba + (T.h * 0.32) / z };
  const desp = (eje, tamPant, tamSala, f) => tamSala * z <= tamPant ? (tamPant - tamSala * z) / 2
    : ((opciones.defecto && estado === 'puerta') || (tam === '390' && e.dialogo && eje === 'y')) ? tamPant / 2 - f * z : Math.min(0, Math.max(tamPant - tamSala * z, tamPant / 2 - f * z));
  const ox = desp('x', T.w, SALA.w, foco.x); const oy = desp('y', T.h, SALA.h, foco.y);
  const aPant = (x, y) => ({ x: ox + x * z, y: oy + y * z });

  let mundo = `<img src="${ARTE['sala-espera-noche']}" alt="" style="left:${ox}px;top:${oy}px;width:${SALA.w * z}px;height:${SALA.h * z}px">`;
  if (e.kit) { const p = aPant(836, 382); mundo += `<img src="${ARTE['kit-pap']}" alt="" style="left:${p.x}px;top:${p.y}px;width:${28 * z}px;height:auto" class="kit">`; }
  const v = aPant(e.val.x - 24, e.val.y - 70);
  mundo += `<img src="${ARTE['valentina-' + e.val.cara]}" alt="" style="left:${v.x}px;top:${v.y}px;width:${48 * z}px;height:${76 * z}px">`;
  const etiquetas = PNJ.map((p) => ({ ...aPant(p.x, p.y + 4), t: p.nombre }));
  if (e.kit) etiquetas.push({ ...aPant(850, 400), t: 'Kit PAP' });
  mundo += etiquetas.map((p) => `<span class="etiqueta" style="left:${p.x}px;top:${p.y + 2 * z}px">${p.t}</span>`).join('');

  raiz._puerta = e.puerta ? { ...aPant(PUERTA.x, PUERTA.arriba) } : null;
  const hud = [];
  if (tam === '390') return pantallaTelefono(raiz, e, mundo, estado);
  const altoFranja = tam === '1920' ? 105 : 70;
  if (variante === 'A' && tam !== '390') { raiz.style.setProperty('--alto-franja', altoFranja + 'px'); hud.push(franja(tam)); }
  if (!e.cine) {
    hud.push(objetivo(e));
    if (variante === 'B' || tam === '390') hud.push(esquinaDerecha(tam));
    hud.push(carril(e, tam === '390' ? 'B' : variante));
    if (e.plano && tam !== '390') hud.push(plano(variante, variante === 'B' ? (tam === '1920' ? '150px' : '104px') : `calc(${altoFranja}px + var(--borde))`));
  }
  if (e.abajo) {
    hud.push(`<div class="abajo-izq" data-tapa><button type="button" class="u-salida">Salida segura${tam !== '390' ? tecla('Esc') : ''}</button>${herramientas(e, tam)}</div>`);
    if (e.accion) hud.push(`<div class="abajo-der" data-tapa>${accion(e.accion)}</div>`);
  }
  let cine = '';
  if (e.cine) {
    const arriba = tam === '390' || variante === 'A' ? '' : `<div class="cine-arriba" data-tapa>
      <span class="cine-arriba__izq"><span class="chip">${ETAPA}</span><span class="cine-arriba__obj"><b>Objetivo</b>${OBJETIVO}</span></span>
      ${variante === 'B' ? '<span class="u-boton sensible" style="min-height:0;font-size:.86em">' + ico('aviso') + '<span>Contenido sensible</span></span>' : ''}
      <span style="flex:none">${persona(tam)}</span></div>`;
    cine = arriba + '<div class="cine-abajo" id="cine-abajo"></div>';
  }
  raiz.innerHTML = `<div class="mundo" aria-hidden="true">${mundo}</div><div class="avisos-mundo"></div>${cine}<div class="hud">${hud.join('')}</div>
    ${e.dialogo ? dialogo(e.dialogo, tam) : ''}${e.capa ? `<div class="hud" style="pointer-events:auto">${capa(e.capa)}</div>` : ''}`;
  if (e.capa === 'capitulo') {
    // REGLA-004: durante el fundido, «Salida segura» y el pie quedan por encima del velo.
    const pie = raiz.querySelector('.abajo-izq'); if (pie) raiz.appendChild(pie.cloneNode(true));
  }
  raiz._puerta = e.puerta ? { ...aPant(PUERTA.x, PUERTA.arriba) } : null;
  raiz._accion = e.accion;
  return raiz;
}

// Caja de un elemento en px de la pantalla (sin la escala de la lámina).
function cajaDe(raiz, el) {
  const R = raiz.getBoundingClientRect(); const k = R.width / raiz.offsetWidth; const r = el.getBoundingClientRect();
  return { x: (r.left - R.left) / k, y: (r.top - R.top) / k, w: r.width / k, h: r.height / k };
}
// Las piezas que se ven (no las cajas de grupo, que tienen huecos): lo que tapa la interfaz y lo que el aviso de puerta esquiva.
const PIEZAS = '.hud .u-placa, .hud .u-rotulo, .hud .u-boton, .hud .u-salida, .hud .u-ranura, .hud .u-ficha, .hud .u-tecla--icono, .hud .franja, .cine-arriba, .cine-abajo, .dlg, .avisos-mundo .aviso-puerta';
function piezas(raiz, sin) {
  const els = [...raiz.querySelectorAll(PIEZAS)].filter((el) => el !== sin);
  return els.filter((el) => !els.some((o) => o !== el && o.contains(el))).map((el) => cajaDe(raiz, el));
}

function pantallaTelefono(raiz, e, mundo, estado) {
  const llave = (i, n, extra = '') => `<button type="button" class="u-tecla u-tecla--icono" aria-label="${n}" title="${n}" ${extra}>${ico(i)}</button>`;
  const teclas = [['ira', 'Ir a… personas y puertas de la sala'], ['ayuda', 'Abrir cómo se juega'], ['bitacora', 'Abrir bitácora reflexiva (J)'], ['ajustes', 'Abrir ajustes del juego (incluye volver al catálogo)']]
    .map(([i, n]) => llave(i, n)).join('');
  const arriba = [];
  if (!e.dialogo) {
    arriba.push(`<div class="u-placa barra-der" data-tapa>${persona('390')}<span class="separador" aria-hidden="true"></span><div class="teclas">${teclas}</div></div>`);
    arriba.push(objetivo(e));
  }
  arriba.push(carril(e, 'B'));
  const abajo = [];
  if (e.abajo) {
    if (e.accion) abajo.push(accion(e.accion));
    abajo.push(herramientas(e, '390'));
    abajo.push(`<div style="display:flex"><button type="button" class="u-salida" style="min-height:calc(28 * var(--px))">Salida segura</button></div>`);
  }
  const camara = e.abajo && !e.capa ? `<div class="tel-camara">${llave('pin', 'Abrir plano (M). Estás en: Sala de espera.')}${llave('lupa', 'Vista cercana (Z)', 'aria-pressed="false"')}</div>` : '';
  raiz.innerHTML = `<div class="mundo" aria-hidden="true">${mundo}</div><div class="avisos-mundo"></div>
    <div class="hud"><div class="tel-arriba">${arriba.join('')}</div>${camara}<div class="tel-abajo" data-tapa>${abajo.join('')}</div></div>
    ${e.dialogo ? dialogo(e.dialogo, '390') : ''}${e.capa ? `<div class="hud" style="pointer-events:auto">${capa(e.capa)}</div>` : ''}`;
  if (e.capa === 'capitulo') { const pie = raiz.querySelector('.tel-abajo'); if (pie) raiz.appendChild(pie.cloneNode(true)); }
  return raiz;
}

// El aviso de puerta (P2) cuelga de la puerta. Si arriba le estorba una pieza del HUD o el borde, prueba en orden: correrse por
// la pared con la cola señalando la puerta, ponerse al lado de la puerta (cola de lado) y, si nada cabe, bajo la puerta.
function colocarAvisoDePuerta(raiz) {
  const ancla = raiz._puerta; const capa = raiz.querySelector('.avisos-mundo');
  if (!ancla || !capa) return;
  const conTecla = raiz.dataset.tam !== '390';
  capa.innerHTML = `<button type="button" class="u-placa aviso-puerta" aria-label="${PUERTA.texto}: cerrada. ${PUERTA.detalle}">
      ${conTecla ? tecla('E') : ''}${ico('candado')}<span>${PUERTA.texto}</span><span class="aviso-puerta__detalle">${PUERTA.detalle}</span></button>`;
  const aviso = capa.firstElementChild; const W = raiz.offsetWidth; const H = raiz.offsetHeight;
  const px = parseFloat(getComputedStyle(raiz).getPropertyValue('--px')) || 2;
  const w = aviso.offsetWidth; const h = aviso.offsetHeight; const cola = 4 * px; const margen = 6 * px;
  const hud = piezas(raiz, aviso).filter((b) => b.w * b.h < W * H * 0.6);
  const libre = (r) => r.x >= margen && r.x + r.w <= W - margen && r.y >= margen && r.y + r.h <= H - margen
    && !hud.some((b) => r.x < b.x + b.w + margen && r.x + r.w + margen > b.x && r.y < b.y + b.h + margen && r.y + r.h + margen > b.y);
  const z = TAM[raiz.dataset.tam].z;
  const izq = ancla.x + (PUERTA.izq - PUERTA.x) * z, der = ancla.x + (PUERTA.der - PUERTA.x) * z, abajo = ancla.y + (PUERTA.abajo - PUERTA.arriba) * z;
  const ladoY = ancla.y + 10 * z;
  const opciones = [{ x: ancla.x - w / 2, y: ancla.y - cola - h + px, lado: 'arriba' }];
  for (let d = 8; d < w / 2 - 8 * px; d += 8) opciones.push({ x: ancla.x - w / 2 - d, y: ancla.y - cola - h + px, lado: 'arriba' }, { x: ancla.x - w / 2 + d, y: ancla.y - cola - h + px, lado: 'arriba' });
  const medioY = ancla.y + ((PUERTA.abajo - PUERTA.arriba) * z) / 2 - h / 2;
  opciones.push({ x: izq - cola - w + px, y: ladoY, lado: 'izq' }, { x: der + cola - px, y: ladoY, lado: 'der' },
    { x: izq - cola - w + px, y: medioY, lado: 'izq' }, { x: der + cola - px, y: medioY, lado: 'der' }, { x: ancla.x - w / 2, y: abajo + cola - px, lado: 'abajo' });
  const elegida = opciones.find((o) => libre({ x: o.x, y: o.y, w, h })) ?? opciones[opciones.length - 1];
  aviso.style.left = elegida.x + 'px'; aviso.style.top = elegida.y + 'px';
  const c = document.createElement('span');
  const forma = { arriba: 'cola', abajo: 'colaArriba', izq: 'colaDer', der: 'colaIzq' }[elegida.lado];
  c.className = 'cola' + (elegida.lado === 'izq' || elegida.lado === 'der' ? ' cola--lado' : '');
  c.innerHTML = ico(forma); c.firstElementChild.style.width = '100%'; c.firstElementChild.style.height = '100%';
  if (elegida.lado === 'arriba') { c.style.left = (ancla.x - 3.5 * px) + 'px'; c.style.top = (elegida.y + h - px) + 'px'; }
  if (elegida.lado === 'abajo') { c.style.left = (ancla.x - 3.5 * px) + 'px'; c.style.top = (elegida.y - cola + px) + 'px'; }
  if (elegida.lado === 'izq') { c.style.left = (elegida.x + w - px) + 'px'; c.style.top = (elegida.y + h / 2 - 3.5 * px) + 'px'; }
  if (elegida.lado === 'der') { c.style.left = (elegida.x - cola + px) + 'px'; c.style.top = (elegida.y + h / 2 - 3.5 * px) + 'px'; }
  capa.appendChild(c);
  raiz.dataset.avisoPuerta = elegida.lado;
}

// Ajustes que dependen de medidas.
function ajustar(raiz) {
  const W = raiz.offsetWidth; const px = parseFloat(getComputedStyle(raiz).getPropertyValue('--px')) || 2; const margen = 6 * px;
  // El carril de avisos ocupa el hueco entre el grupo de la izquierda y el de la derecha (o el plano, en A).
  const carril = raiz.querySelector('.carril');
  const izq = raiz.querySelector('.esq-izq'); const der = raiz.querySelector('.esq-der') || raiz.querySelector('.plano');
  if (carril && izq && der && raiz.dataset.tam !== '390') {
    const a = cajaDe(raiz, izq); const b = cajaDe(raiz, der.querySelector('.u-placa') || der);
    carril.style.left = (a.x + a.w + margen) + 'px'; carril.style.width = (b.x - a.x - a.w - 2 * margen) + 'px';
    carril.style.maxWidth = 'none'; carril.style.transform = 'none';
  }
  // El plano cuelga del grupo de la derecha (B) con la misma separación que hay entre piezas.
  const plano = raiz.querySelector('.plano'); const esqDer = raiz.querySelector('.esq-der');
  if (plano && esqDer && raiz.dataset.tam !== '390') { const b = cajaDe(raiz, esqDer); plano.style.top = (b.y + b.h + 2 * px) + 'px'; }
  // Los rótulos del mundo no se salen: se corren hacia dentro, y si quien los lleva está fuera de cuadro, no se pintan.
  for (const et of raiz.querySelectorAll('.etiqueta')) {
    const x = parseFloat(et.style.left); const w = et.offsetWidth;
    if (x < 0 || x > W) { et.hidden = true; continue; }
    et.style.left = Math.min(W - margen - w / 2, Math.max(margen + w / 2, x)) + 'px';
  }
  // La lista de fichas se acota a filas enteras y bajo ella se dice qué queda abajo (como hace el panel de I1).
  const lista = raiz.querySelector('.strip--con-opciones .choices');
  if (lista) {
    const L = lista.getBoundingClientRect(); const fichas = [...lista.querySelectorAll('.choice-btn')];
    const cortadas = fichas.filter((f) => f.getBoundingClientRect().bottom > L.bottom + 1);
    if (cortadas.length) {
      const enteras = fichas.filter((f) => !cortadas.includes(f));
      const fondo = Math.max(...enteras.map((f) => f.getBoundingClientRect().bottom));
      const k = L.height / lista.offsetHeight;
      lista.style.maxHeight = ((fondo - L.top) / k + 2 * px) + 'px';
      const letras = cortadas.map((f) => f.querySelector('.choice-num').dataset.letra);
      lista.closest('.strip-body').dataset.mas = 'Más abajo: ' + letras.join(' y ');
    }
  }
  const dlg = raiz.querySelector('.dlg'); const abajo = raiz.querySelector('#cine-abajo');
  if (dlg && abajo) abajo.style.height = dlg.offsetHeight + 'px';
  if (dlg) raiz.dataset.altoOcupado = dlg.offsetHeight;
  colocarAvisoDePuerta(raiz);
}

// Cuánto tapa la interfaz: unión de las piezas, en una rejilla de 4 px.
function medir(raiz) {
  const W = raiz.offsetWidth, H = raiz.offsetHeight, g = 4;
  const cols = Math.ceil(W / g), filas = Math.ceil(H / g), malla = new Uint8Array(cols * filas);
  const cajas = piezas(raiz);
  for (const c of cajas) for (let y = Math.max(0, Math.floor(c.y / g)); y < Math.min(filas, Math.ceil((c.y + c.h) / g)); y++) for (let x = Math.max(0, Math.floor(c.x / g)); x < Math.min(cols, Math.ceil((c.x + c.w) / g)); x++) malla[y * cols + x] = 1;
  let n = 0; for (const b of malla) n += b;
  return { pct: Math.round((1000 * n) / malla.length) / 10, cajas };
}
function pintarZonas(raiz, cajas) { for (const c of cajas) { const z = document.createElement('span'); z.className = 'zona'; Object.assign(z.style, { left: c.x + 'px', top: c.y + 'px', width: c.w + 'px', height: c.h + 'px' }); raiz.appendChild(z); } }

// ── La página ───────────────────────────────────────────────────────────────────────────────────────────────────────
const VARS = {};
for (const [k, v] of Object.entries(ARTE)) {
  const url = `url(${v})`;
  if (k.startsWith('marco-') || k.startsWith('trama-')) VARS['--' + k.replace(/-noche$/, '')] = url;
  if (k.startsWith('letra-')) VARS['--' + k] = url;
  if (k.startsWith('pulso-')) VARS['--' + k] = url;
}
Object.assign(VARS, { '--cursor': `url(${ARTE['cursor-noche']})`, '--seguir': `url(${ARTE['seguir-noche']})`, '--sombra': `url(${ARTE['sombra']})`,
  '--icono-salida': `url(${ARTE['icono-salida']})`, '--icono-bombilla': `url(${ARTE['icono-bombilla-noche']})`, '--icono-bombilla-apagada': `url(${ARTE['icono-bombilla-apagada']})` });

const q = new URLSearchParams(location.search);
const est = { estado: q.get('estado') || 'explorando', tam: q.get('tam') || '1366', vista: q.get('vista') || 'lado', var: q.get('var') || 'B',
  zonas: q.get('zonas') === '1', quieto: q.get('quieto') === '1', defecto: q.get('defecto') === '1' };
const solo = q.get('solo') === '1';

function lamina(tipo) {
  const T = TAM[est.tam]; const caja = document.createElement('div'); caja.className = 'lamina__caja';
  const fig = document.createElement('figure'); fig.className = 'lamina'; fig.style.margin = '0';
  const pie = document.createElement('figcaption'); pie.className = 'lamina__pie';
  let cosa;
  if (tipo === 'hoy') {
    const clave = HOY_DE[est.estado]?.[est.tam];
    cosa = document.createElement('div'); cosa.className = 'hoy'; cosa.style.width = T.w + 'px'; cosa.style.height = T.h + 'px';
    cosa.innerHTML = clave ? `<img src="${HOY[clave]}" alt="El juego de hoy: ${ESTADOS.find((s) => s.id === est.estado).nombre}">` : '<div class="hoy__falta">No hay captura del juego de hoy en este estado y tamaño.</div>';
    pie.innerHTML = `<strong>Hoy</strong><span>${clave ? HOY_NOTA[clave] : 'sin captura'}</span>${HOY_TAPA[est.tam] && est.estado === 'explorando' ? `<span>La interfaz tapa ≈ ${HOY_TAPA[est.tam]} % al explorar (medido sobre las capturas, sin y con la franja de contenido sensible)</span>` : ''}`;
  } else {
    cosa = pantalla(est.estado, est.tam, est.var, { quieto: est.quieto, defecto: est.defecto });
    pie.innerHTML = `<strong>Nueva · ${est.var === 'B' ? 'B, placas en las esquinas' : 'A, franja continua'}</strong><span class="medida"></span>`;
  }
  caja.appendChild(cosa); fig.append(caja, pie);
  return { fig, caja, cosa, pie, T };
}

function dibujar() {
  const escenaEl = document.getElementById('escena');
  escenaEl.innerHTML = '';
  escenaEl.className = 'escena' + (est.vista === 'lado' ? ' escena--lado' : '');
  const tipos = est.vista === 'lado' ? ['hoy', 'nueva'] : [est.vista];
  const laminas = tipos.map(lamina);
  laminas.forEach((l) => escenaEl.appendChild(l.fig));
  const escalar = () => laminas.forEach((l) => { const ancho = l.caja.parentElement.clientWidth; const k = Math.min(1, ancho / l.T.w); l.caja.style.width = l.T.w * k + 'px'; l.caja.style.height = l.T.h * k + 'px'; l.cosa.style.transform = `scale(${k})`; });
  escalar();
  for (const l of laminas) if (l.cosa.classList.contains('pantalla')) {
    ajustar(l.cosa);
    const m = medir(l.cosa);
    l.pie.querySelector('.medida').textContent = `La interfaz tapa el ${m.pct.toLocaleString('es')} % de la pantalla${l.cosa.dataset.altoOcupado ? ` · cuadro de ${l.cosa.dataset.altoOcupado} px (data-alto-ocupado)` : ''}`;
    l.cosa.dataset.tapa = m.pct;
    if (est.zonas) pintarZonas(l.cosa, m.cajas);
  }
  window.onresize = escalar;
  document.querySelectorAll('button[data-tam]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tam === est.tam)));
  document.querySelectorAll('button[data-vista]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vista === est.vista)));
  document.querySelectorAll('button[data-var]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.var === est.var)));
  document.querySelectorAll('#estados button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.estado === est.estado)));
  document.getElementById('b-zonas').setAttribute('aria-pressed', String(est.zonas));
  document.getElementById('b-quieto').setAttribute('aria-pressed', String(est.quieto));
  const bd = document.getElementById('b-defecto'); bd.hidden = est.estado !== 'puerta'; bd.setAttribute('aria-pressed', String(est.defecto));
}

function notas() {
  document.getElementById('notas').innerHTML = `
  <article class="nota"><h2>Qué cambia</h2><ul>
    <li>Todo es una de cuatro piezas del cuadro de diálogo: <b>placa</b> (superficie con marco y trama), <b>pestaña</b> (el nombre que tapa el canto de una placa), <b>tecla</b> (la de A a D y Esc) y <b>ficha</b> (el botón). Mismos PNG, misma luz de la sala.</li>
    <li>La parte de arriba repite la forma del cuadro: pestaña con el nombre de la escena sobre la placa del objetivo, como el nombre de quien habla sobre su placa.</li>
    <li>Los botones de iconos son teclas: al pasar o enfocar se encienden con la luz de la sala, igual que la letra de una ficha.</li>
    <li>«Salida segura» es la placa con brasa de I1 en todos los estados: abajo a la izquierda al explorar, en la cabecera del cuadro al hablar, en «Ir a…» y durante el fundido de capítulo.</li>
    <li>Las herramientas usan los cuadernos de O1 a su tamaño de pixel; bloqueada lleva candado, nueva centellea ocho veces y se queda quieta.</li>
    <li>Todos los avisos van en un solo carril arriba al centro, entre los dos grupos. Así el aviso de la puerta cerrada ya no cae sobre la ficha del objetivo.</li>
    <li>El aviso de la puerta, anclado a la puerta, se corre por la pared si una pieza le estorba y la cola sigue señalando la puerta. Los rótulos de personas y objetos van colgados de cada uno y caminan con ellos.</li>
    <li>Al explorar, la interfaz tapa el 22 % de la pantalla a 1366 (hoy, 26 a 29 %) y el 13 % a 1920 (hoy, 17 a 20 %). A 1920 el HUD usa el punto del mundo, 2 px como la cámara en ×2; el cuadro de diálogo conserva sus 3 px.</li>
    <li>En el teléfono, como hoy, no van el título del caso, el lugar ni el texto de la persona, y «Volver al catálogo» vive en Ajustes. El plano y la vista cercana pasan a dos teclas de cámara al borde derecho.</li>
    <li>Ningún texto clínico cambia. Todas las acciones, nombres accesibles y teclas de hoy siguen.</li></ul></article>
  <article class="nota"><h2>La única bifurcación: la parte de arriba</h2>
    <p><b>B · Placas en las esquinas (recomendada).</b> La sala llega hasta el borde de arriba; el objetivo queda a la izquierda, la persona y las teclas a la derecha, y el centro queda libre para la sala y los avisos. Se ve como un juego, no como una página con cabecera. En la decisión, el HUD se reduce a una línea dentro de la franja negra del cine. Tapa menos sala que hoy (ver la medida bajo cada pantalla).</p>
    <p><b>A · Franja continua.</b> La barra de hoy hecha placa: todo en una línea, el orden de siempre, lo más fácil de aplicar. Se come una franja de 70 px a todo lo ancho, y en la decisión queda encima de la franja del cine.</p>
    <p class="suave">En el teléfono las dos coinciden: no hay ancho para esquinas, así que va una placa arriba y el objetivo debajo.</p></article>
  <article class="nota"><h2>Qué pieza va en qué componente</h2><div class="tabla"><table>
    <thead><tr><th>Pieza</th><th>Componente del juego</th></tr></thead><tbody>
    <tr><td>Pestaña + placa del objetivo</td><td><code>scene-goal-card</code>, envoltorio <code>.objective-card</code></td></tr>
    <tr><td>Persona, teclas del menú, título del caso</td><td><code>simulation-hud</code></td></tr>
    <tr><td>Chip y aviso de contenido sensible</td><td><code>sensitive-notice</code></td></tr>
    <tr><td>Carril de avisos</td><td><code>.soft-notice</code>, <code>.room-banner</code>, <code>.pausing-notice</code>, <code>ui-toast-host</code> (posición de juego)</td></tr>
    <tr><td>Plano y sus botones</td><td><code>app-minimapa</code> (M1)</td></tr>
    <tr><td>Placa con brasa</td><td><code>safe-exit-button</code> (variante de I1)</td></tr>
    <tr><td>Ranuras de herramientas</td><td><code>tool-inventory</code> con los iconos de O1</td></tr>
    <tr><td>Ficha de acción cercana</td><td><code>.context-bar</code> de <code>simulation-play</code></td></tr>
    <tr><td>Aviso de puerta con cola</td><td><code>aviso-de-puerta</code> (P2)</td></tr>
    <tr><td>Rótulos del mundo</td><td>rótulos de <code>game-world</code></td></tr>
    <tr><td>Pausa, capítulo, «Ir a…», plano completo</td><td><code>attempt-outcome</code>, <code>.transition-note</code>, <code>world-places-list</code>, <code>app-plano-completo</code></td></tr>
    <tr><td>«Pedir una pista» y «Ver pista»</td><td><code>scene-hint</code> (variante de I1)</td></tr>
    </tbody></table></div></article>`;
}

function iniciar() {
  if (solo) {
    document.getElementById('pagina').hidden = true;
    const r = est.vista === 'hoy' ? lamina('hoy').cosa : pantalla(est.estado, est.tam, est.var, { quieto: est.quieto, defecto: est.defecto });
    r.style.position = 'relative'; r.id = 'solo';
    document.body.style.margin = '0'; document.body.appendChild(r);
    if (r.classList.contains('pantalla')) { ajustar(r); const m = medir(r); r.dataset.tapa = m.pct; if (est.zonas) pintarZonas(r, m.cajas); }
    document.body.dataset.listo = '1';
    return;
  }
  const cont = document.getElementById('estados');
  cont.innerHTML = ESTADOS.map((s) => `<button type="button" data-estado="${s.id}">${s.nombre}</button>`).join('');
  cont.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { est.estado = b.dataset.estado; dibujar(); } });
  document.querySelectorAll('button[data-tam]').forEach((b) => b.addEventListener('click', () => { est.tam = b.dataset.tam; dibujar(); }));
  document.querySelectorAll('button[data-vista]').forEach((b) => b.addEventListener('click', () => { est.vista = b.dataset.vista; dibujar(); }));
  document.querySelectorAll('button[data-var]').forEach((b) => b.addEventListener('click', () => { est.var = b.dataset.var; dibujar(); }));
  document.getElementById('b-zonas').onclick = () => { est.zonas = !est.zonas; dibujar(); };
  document.getElementById('b-quieto').onclick = () => { est.quieto = !est.quieto; dibujar(); };
  document.getElementById('b-defecto').onclick = () => { est.defecto = !est.defecto; dibujar(); };
  notas(); dibujar();
  document.body.dataset.listo = '1';
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(iniciar);
</script>
