<form [formGroup]="group()" novalidate (ngSubmit)="host.save()">
  <ui-dialog-frame [title]="host.panelTitle()">
    <div class="cs-fields">
      @let g = group();
      @switch (section()) {
        @case ('node') {
          <ui-field label="Clave del nodo" required [error]="host.fieldError(control(g, 'nodeKey'), 'Escribe la clave del nodo.')">
            <input uiControl type="text" formControlName="nodeKey" placeholder="urgencias-crisis" autocomplete="off">
          </ui-field>
          <ui-field label="Título" required [error]="host.fieldError(control(g, 'title'), 'Escribe el título del nodo.')">
            <input uiControl type="text" formControlName="title" placeholder="Sala de urgencias" autocomplete="off">
          </ui-field>
          <ui-field label="Narrativa" required [error]="host.fieldError(control(g, 'narrative'), 'Escribe la narrativa del nodo.')">
            <textarea uiControl rows="4" formControlName="narrative"></textarea>
          </ui-field>
          <ui-field label="Mensaje de advertencia">
            <input uiControl type="text" formControlName="warningMessage" placeholder="Contenido sensible: violencia..." autocomplete="off">
          </ui-field>
          <div class="cs-checks">
            <label ui-check><input type="checkbox" formControlName="startNode">Nodo inicial</label>
            <label ui-check><input type="checkbox" formControlName="terminal">Nodo terminal</label>
            <label ui-check><input type="checkbox" formControlName="sensitiveContent">Contenido sensible</label>
            <label ui-check><input type="checkbox" formControlName="safeExitRequired">Salida segura obligatoria</label>
          </div>
          <div class="cs-row">
            <ui-field label="Posición X">
              <input uiControl type="number" formControlName="positionX">
            </ui-field>
            <ui-field label="Posición Y">
              <input uiControl type="number" formControlName="positionY">
            </ui-field>
          </div>
        }
        @case ('decision') {
          <ui-field label="Nodo origen" required [error]="host.fieldError(control(g, 'sourceNodeId'), 'Elige el nodo de origen.')">
            <select uiControl formControlName="sourceNodeId">
              @for (n of host.editor()?.nodes ?? []; track n.id) {
                <option [ngValue]="n.id">{{ nodeOptionLabel(n) }}</option>
              }
            </select>
          </ui-field>
          <ui-field label="Nodo destino" required [error]="host.fieldError(control(g, 'targetNodeId'), 'Elige el nodo de destino.')">
            <select uiControl formControlName="targetNodeId">
              @for (n of host.editor()?.nodes ?? []; track n.id) {
                <option [ngValue]="n.id">{{ nodeOptionLabel(n) }}</option>
              }
            </select>
          </ui-field>
          <ui-field label="Texto de la decisión" required [error]="host.fieldError(control(g, 'text'), 'Escribe el texto de la decisión.')">
            <textarea uiControl rows="3" formControlName="text" placeholder="Escucha activa y validación emocional..."></textarea>
          </ui-field>
          <ui-field label="Clasificación" required>
            <select uiControl formControlName="classification">
              @for (option of classifications; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          </ui-field>
          <div class="cs-row">
            <ui-field label="Cambio de puntaje">
              <input uiControl type="number" formControlName="scoreDelta">
            </ui-field>
            <ui-field label="Cambio de estrés (%)">
              <input uiControl type="number" formControlName="stressDelta">
            </ui-field>
          </div>
          <ui-field label="Retroalimentación inmediata">
            <textarea uiControl rows="2" formControlName="immediateFeedback"></textarea>
          </ui-field>
          <div class="cs-checks">
            <label ui-check><input type="checkbox" formControlName="prohibitedConduct">Conducta prohibida (penalización grave)</label>
          </div>
          @if (g.get('prohibitedConduct')?.value) {
            <ui-field label="Razón de prohibición" required [error]="host.fieldError(control(g, 'prohibitionReason'), 'Escribe la razón de la prohibición.')">
              <input uiControl type="text" formControlName="prohibitionReason" autocomplete="off">
            </ui-field>
            <ui-field label="Penalización de puntaje">
              <input uiControl type="number" formControlName="prohibitedPenalty">
            </ui-field>
          }
        }
        @case ('map') {
          <ui-field label="Nodo asociado" required [error]="host.fieldError(control(g, 'nodeId'), 'Elige el nodo del mapa.')">
            <select uiControl formControlName="nodeId">
              @for (n of host.editor()?.nodes ?? []; track n.id) {
                <option [ngValue]="n.id">{{ nodeOptionLabel(n) }}</option>
              }
            </select>
          </ui-field>
          <ui-field label="Clave del mapa" required [error]="host.fieldError(control(g, 'mapKey'), 'Escribe la clave del mapa.')">
            <input uiControl type="text" formControlName="mapKey" placeholder="urgencias-crisis-map" autocomplete="off">
          </ui-field>
          <ui-field label="Título del mapa" required [error]="host.fieldError(control(g, 'title'), 'Escribe el título del mapa.')">
            <input uiControl type="text" formControlName="title" placeholder="Sala de urgencias hospitalaria" autocomplete="off">
          </ui-field>
          <ui-field label="Tema visual">
            <select uiControl formControlName="theme">
              @for (option of themes; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          </ui-field>
          <div class="cs-row">
            <ui-field label="Ancho"><input uiControl type="number" formControlName="width"></ui-field>
            <ui-field label="Alto"><input uiControl type="number" formControlName="height"></ui-field>
          </div>
          <div class="cs-row">
            <ui-field label="Aparece en X"><input uiControl type="number" formControlName="spawnX"></ui-field>
            <ui-field label="Aparece en Y"><input uiControl type="number" formControlName="spawnY"></ui-field>
          </div>
        }
        @case ('object') {
          <ui-field label="Clave del objeto" required [error]="host.fieldError(control(g, 'objectKey'), 'Escribe la clave del objeto.')">
            <input uiControl type="text" formControlName="objectKey" placeholder="consultante-sofia" autocomplete="off">
          </ui-field>
          <ui-field label="Etiqueta" required [error]="host.fieldError(control(g, 'label'), 'Escribe la etiqueta del objeto.')">
            <input uiControl type="text" formControlName="label" placeholder="Sofía (consultante)" autocomplete="off">
          </ui-field>
          <ui-field label="Tipo" required>
            <select uiControl formControlName="objectType">
              @for (type of objectTypes; track type) {
                <option [value]="type">{{ objectTypeLabel(type) }}</option>
              }
            </select>
          </ui-field>
          <ui-field label="Indicación de interacción" required [error]="host.fieldError(control(g, 'interactionPrompt'), 'Escribe la indicación que verá la persona.')">
            <input uiControl type="text" formControlName="interactionPrompt" autocomplete="off">
          </ui-field>
          <ui-field label="Texto de interacción">
            <textarea uiControl rows="3" formControlName="interactionText"></textarea>
          </ui-field>
          <div class="cs-row">
            <ui-field label="X"><input uiControl type="number" formControlName="x"></ui-field>
            <ui-field label="Y"><input uiControl type="number" formControlName="y"></ui-field>
          </div>
          <div class="cs-row">
            <ui-field label="Color hex"><input uiControl type="text" formControlName="colorHex" placeholder="#4FA3A5" autocomplete="off"></ui-field>
            <ui-field label="Código corto"><input uiControl type="text" formControlName="shortCode" maxlength="12" placeholder="SOF" autocomplete="off"></ui-field>
          </div>
          <ui-field label="Icono Material">
            <input uiControl type="text" formControlName="icon" placeholder="psychology" autocomplete="off">
          </ui-field>
          <ui-field label="Decisión vinculada">
            <select uiControl formControlName="decisionOptionId">
              <option [ngValue]="null">— Ninguna —</option>
              @for (d of host.editor()?.decisions ?? []; track d.id) {
                <option [ngValue]="d.id">{{ d.id }} — {{ shorten(d.text) }}</option>
              }
            </select>
          </ui-field>
          <ui-field label="Herramienta vinculada">
            <select uiControl formControlName="toolCode">
              <option [ngValue]="null">— Ninguna —</option>
              @for (t of host.editor()?.tools ?? []; track t.id) {
                <option [ngValue]="t.code">{{ t.code }} — {{ t.label }}</option>
              }
            </select>
          </ui-field>
          <div class="cs-checks">
            <label ui-check><input type="checkbox" formControlName="collision">Colisión activa</label>
            <label ui-check><input type="checkbox" formControlName="visible">Visible en el mapa</label>
          </div>
        }
        @case ('tool') {
          <ui-field label="Código" required [error]="host.fieldError(control(g, 'toolCode'), 'Escribe el código de la herramienta.')">
            <input uiControl type="text" formControlName="toolCode" placeholder="PAP" autocomplete="off">
          </ui-field>
          <ui-field label="Etiqueta" required [error]="host.fieldError(control(g, 'label'), 'Escribe la etiqueta de la herramienta.')">
            <input uiControl type="text" formControlName="label" placeholder="Primeros Auxilios Psicológicos" autocomplete="off">
          </ui-field>
          <ui-field label="Categoría">
            <input uiControl type="text" formControlName="category" placeholder="clinical" autocomplete="off">
          </ui-field>
          <ui-field label="Icono Material">
            <input uiControl type="text" formControlName="icon" placeholder="psychology" autocomplete="off">
          </ui-field>
          <ui-field label="Descripción" required [error]="host.fieldError(control(g, 'description'), 'Escribe la descripción de la herramienta.')">
            <textarea uiControl rows="4" formControlName="description"></textarea>
          </ui-field>
        }
      }
    </div>
    <button ui-button uiDialogActions type="button" variant="secondary" (click)="host.closePanel()">Cancelar</button>
    <button ui-button uiDialogActions type="submit" icon="save" [loading]="host.busy()">
      {{ host.busy() ? 'Guardando…' : saveLabel() }}
    </button>
  </ui-dialog-frame>
</form>
